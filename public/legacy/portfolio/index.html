together.","tech":"","url":"https://civiceye.co.in/","context":"Our flagship project","repository":"","visual":"city","linkLabel":"Visit CivicEye","flagship":true,"problemStatement":"","idealSolution":"","lessonsLearned":"","eventName":"","eventType":"","eventVenue":"","eventLocation":"","eventOutcome":"","public":true},{"id":"agripulse","title":"AgriPulse","description":"AgriPulse was our agritech app project for NexHack at IITM Delhi. It aimed to bring leaf scanning, a central marketplace for farmers to sell their crops, and other supporting features into one app.","tech":"","url":"","context":"NexHack · IITM Delhi","repository":"","visual":"plant","linkLabel":"Visit project","flagship":false,"problemStatement":"We wanted to support farmers with leaf-scanning tools and a central place to sell their crops. However, we had not researched the problem deeply enough or resolved important questions about trust among rural farmers and how the app would fit their real-world needs.","idealSolution":"Our ideal was one app where farmers could scan leaves, sell their crops in a central marketplace and access supporting features. Making that idea workable would require a focused scope, a clear understanding of farmer needs, trust, and careful attention to loopholes, security and real-world edge cases.","lessonsLearned":"Looking back, we tried to cover too many broad and demanding use cases without enough research. We had unresolved ambiguities around rural farmers’ trust and had not thought through the many loopholes, risks and safeguards an agritech app needs. We see those gaps as reasons the project did not work out and our hackathon attempt fell short.\n\nOur biggest lesson: research as thoroughly as possible before building. Talk to mentors and other people about the project, challenge assumptions, understand real users and narrow the scope before committing to implementation.","eventName":"NexHack","eventType":"Hackathon","eventVenue":"IITM Delhi","eventLocation":"Delhi",
